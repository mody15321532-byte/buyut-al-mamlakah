name: Setup and Build Environment

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # الخطوة دي هي اللي بتثبت فلاتر تلقائياً على سيرفر جيت هاب
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    # التحقق من أن فلاتر اتثبتت واشتغلت تمام
    - run: flutter --version
